on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '23 14 * * 2'
  release:

name: build

jobs:
  lint:
    name: "Run hlint"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up HLint
      uses: haskell-actions/hlint-setup@v2
      with:
        version: "3.6.1"

    - name: Run HLint
      uses: haskell-actions/hlint-run@v2
      with:
        fail-on: warning

  fourmolu:
    name: "Run fourmolu"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/run-fourmolu@v13
      with:
        version: "0.19.0.1"

  generateMatrix:
    name: "Generate matrix from cabal"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - uses: kleidukos/get-tested@v0.1.9.1
        id: set-matrix
        with:
          cabal-file: "rhine/rhine.cabal"
          ubuntu-version: latest
          version: 0.1.9.0

  build-cabal:
    runs-on: ubuntu-latest
    needs: generateMatrix
    strategy:
      matrix: ${{ fromJSON(needs.generateMatrix.outputs.matrix) }}
    name: Haskell GHC ${{ matrix.ghc }} cabal
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2.12.0
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev

      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal build all --dry-run
        # The last step generates dist-newstyle/cache/plan.json for the cache key.

      - name: Restore cached dependencies
        uses: actions/cache/restore@v6
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # The next two blocks currently don't work, see https://github.com/haskell/cabal/issues/6106
      # - name: Install dependencies
      #   # If we had an exact cache hit, the dependencies will be up to date.
      #   if: steps.cache.outputs.cache-hit != 'true'
      #   run: cabal build all --enable-tests --enable-benchmarks --only-dependencies

      # # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
      # - name: Save cached dependencies
      #   uses: actions/cache/save@v6
      #   # If we had an exact cache hit, trying to save the cache would error because of key clash.
      #   if: steps.cache.outputs.cache-hit != 'true'
      #   with:
      #     path: ${{ steps.setup.outputs.cabal-store }}
      #     key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Cabal build packages
        run: cabal build all --enable-tests --enable-benchmarks -fdev
      - name: Cabal test
        run: cabal test all --enable-tests --test-show-details=Always
      - name: Cabal bench
        run: cabal bench all

      # This block is only temporarily, see https://github.com/haskell/cabal/issues/6106
      - name: Save cache
        uses: actions/cache/save@v6
        # If we had an exact cache hit, trying to save the cache would error because of key clash.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  generate-flake-ghc-matrix:
    name: Generate GHC versions for nix flake build matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.generate-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Generate versions
        id: generate-versions
        run: |
          echo -n "versions=" >> "$GITHUB_OUTPUT"
          nix eval .#supportedGhcs --json >> "$GITHUB_OUTPUT"

  build-flake:
    name: Nix Flake
    needs: generate-flake-ghc-matrix
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        version: ${{ fromJSON(needs.generate-flake-ghc-matrix.outputs.versions) }}
      fail-fast: false # So the cache is still filled
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: rhine
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Flake check
        run: nix flake check
      - name: Build all packages
        run: nix build .#${{ matrix.version }} --accept-flake-config
      - run: nix develop .#${{ matrix.version }} --accept-flake-config -c cabal update
      - run: nix develop .#${{ matrix.version }} --accept-flake-config -c cabal test all
      - name: Check whether .nix files are formatted
        run: |
          nix fmt
          git diff --exit-code

  cabal-check:
    name: Check and format all cabal files
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tfausak/cabal-gild-setup-action@v2
        with:
          version: 1.3.0.1
      - run: ./cabal_check.sh

  success:
    name: Successfully build and test on all systems
    # Every job defined above must be listed here: `success` is the one check
    # required by branch protection, and it can only fail for a job that this
    # list names. A bare `needs:` list is not enough either — GitHub *skips* a
    # job whose dependency failed, and branch protection counts a skipped
    # required check as passing, so the gate would go green on a red build.
    # `if: always()` plus `alls-green` is what prevents that: the action's
    # default policy accepts only `success` for every job handed to it.
    # Do not change `always()` to `!cancelled()` — a cancelled dependency
    # would then skip this job, and a skipped required check reports Success.
    needs:
      - lint
      - fourmolu
      - generateMatrix
      - build-cabal
      - generate-flake-ghc-matrix
      - build-flake
      - cabal-check
    if: always()
    runs-on:
      - ubuntu-latest
    steps:
      - name: Fail if any dependency did not succeed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
